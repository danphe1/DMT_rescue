<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#078346"><title>Nepal Scouts Rescuer</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f7f4;color:#17211b}.boot{max-width:520px;margin:60px auto;padding:18px;background:#fff;border:1px solid #dce8e0;border-radius:14px;text-align:center}.spin{width:38px;height:38px;margin:8px auto 14px;border:4px solid #dce8e0;border-top-color:#078346;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.err{color:#b42318}.btn{border:0;border-radius:9px;padding:11px 15px;background:#078346;color:#fff;font-weight:800}</style></head><body><div class="boot" id="boot"><div class="spin"></div><b>Opening Rescuer Portal…</b><p id="stage">Starting…</p></div><script>(async()=>{const APP='https://fkxbohbrfotbwmqalzyw.supabase.co/functions/v1/rescue-field-app-v30';const DIAG='https://fkxbohbrfotbwmqalzyw.supabase.co/functions/v1/rescue-client-diagnostic';const stage=(s,d='')=>{const e=document.getElementById('stage');if(e)e.textContent=s;fetch(DIAG+'?stage='+encodeURIComponent(s)+'&detail='+encodeURIComponent(d),{mode:'no-cors',cache:'no-store'}).catch(()=>{})};const fail=(m)=>{stage('failed',m);document.body.innerHTML='<div class="boot"><b class="err">Rescuer Portal could not open.</b><p>'+String(m).replace(/</g,'&lt;')+'</p><button class="btn" onclick="location.reload()">Retry</button></div>'};try{stage('bootstrap_started');const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),12000);stage('app_fetch_started');const r=await fetch(APP+'?t='+Date.now(),{cache:'no-store',signal:ctl.signal});clearTimeout(to);if(!r.ok)throw Error('App download failed ('+r.status+')');const h=await r.text();stage('app_fetched','bytes='+h.length);const p=new DOMParser().parseFromString(h,'text/html');const scripts=[...p.querySelectorAll('script')].map(s=>({src:s.getAttribute('src')||'',text:s.textContent,attrs:[...s.attributes].map(a=>[a.name,a.value])}));p.querySelectorAll('script').forEach(s=>s.remove());document.title=p.title||'Nepal Scouts Rescuer';document.head.innerHTML=p.head.innerHTML;document.body.innerHTML=p.body.innerHTML;for(const item of scripts){await new Promise((resolve,reject)=>{const s=document.createElement('script');for(const [k,v] of item.attrs)if(k!=='src')s.setAttribute(k,v);if(item.src){s.src=item.src;s.onload=resolve;s.onerror=()=>reject(Error('Script failed: '+item.src));document.body.appendChild(s)}else{s.textContent=item.text;document.body.appendChild(s);resolve()}})}const reg=document.getElementById('register'),file=document.getElementById('photoFile');if(!reg||typeof reg.onclick!=='function'||!file||typeof file.onchange!=='function')throw Error('Form controls did not initialize');stage('scripts_bound');document.documentElement.dataset.rescuerReady='1'}catch(e){fail(e?.name==='AbortError'?'App download timed out. Check mobile data and retry.':(e?.message||String(e)))}})();</script></body></html>
